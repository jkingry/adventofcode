# This workflow will build a .NET project
# For more information see: https://docs.github.com/en/actions/automating-builds-and-tests/building-and-testing-net

name: .NET

on:
  push:
    branches: [ "main" ]
  pull_request:
    branches: [ "main" ]
  workflow_dispatch:

permissions:
  contents: read

# Runs share one input cache that only grows; overlapping runs would each
# restore the same snapshot and redo the same slow, rate-limited downloads.
concurrency:
  group: aoc-inputs
  cancel-in-progress: false

jobs:
  build:

    runs-on: ubuntu-latest
    timeout-minutes: 180

    steps:
    - uses: actions/checkout@v7
    - name: Setup .NET
      uses: actions/setup-dotnet@v5
      with:
        global-json-file: global.json

    - name: Restore dependencies
      run: dotnet restore --locked-mode

    - name: Build
      run: dotnet build --no-restore --configuration Release 

    - name: Create .adventofcode.session file
      env:
        AOC_SESSION: ${{ secrets.AOC_SESSION }}
      run: echo "$AOC_SESSION" > .adventofcode.session

    - name: Read Cache Inputs
      uses: actions/cache/restore@v6
      with:
        key: aoc-inputs-${{ github.run_id }}-${{ github.run_attempt }}
        restore-keys: |
          aoc-inputs-
          session-
        path: 
          '**/inputs/**'
    
    # Results are cached per day, keyed by a hash of the day's source (plus its project and shared code),
    # so only days whose code changed are tested and benchmarked.
    - name: Read Benchmark Cache
      uses: actions/cache/restore@v6
      with:
        key: aoc-bench-${{ github.run_id }}
        restore-keys: |
          aoc-bench-
        path: .bench-cache

    - name: Find days to run
      id: stale
      run: echo "days=$(python3 .github/scripts/benchmark_site.py stale .bench-cache)" >> "$GITHUB_OUTPUT"

    - name: Run tests
      if: steps.stale.outputs.days != ''
      env:
        DAYS: ${{ steps.stale.outputs.days }}
      run: dotnet run --configuration Release --no-build -- test $DAYS

    # Benchmarks only run on main (not for PRs); `bench` only covers days whose tests above passed.
    - name: Run benchmarks
      if: github.ref == 'refs/heads/main' && steps.stale.outputs.days != ''
      env:
        DAYS: ${{ steps.stale.outputs.days }}
      run: |
        dotnet run --configuration Release --no-build -- bench $DAYS
        python3 .github/scripts/benchmark_site.py merge BenchmarkDotNet.Artifacts/results .bench-cache

    - name: Write Cache
      uses: actions/cache/save@v6
      if: always()
      with:
        key: aoc-inputs-${{ github.run_id }}-${{ github.run_attempt }}
        path: 
          '**/inputs/**'

    - name: Write Benchmark Cache
      uses: actions/cache/save@v6
      if: github.ref == 'refs/heads/main' && !cancelled()
      with:
        key: aoc-bench-${{ github.run_id }}-${{ github.run_attempt }}
        path: .bench-cache

    - name: Build benchmark site
      if: github.ref == 'refs/heads/main'
      run: python3 .github/scripts/benchmark_site.py site .bench-cache _site

    - name: Upload raw benchmark results
      if: github.ref == 'refs/heads/main'
      uses: actions/upload-artifact@v5
      with:
        name: benchmark-results
        path: BenchmarkDotNet.Artifacts/results
        if-no-files-found: ignore

    - name: Upload Pages artifact
      if: github.ref == 'refs/heads/main'
      uses: actions/upload-pages-artifact@v4
      with:
        path: _site

  deploy:
    needs: build
    if: github.ref == 'refs/heads/main'
    runs-on: ubuntu-latest
    permissions:
      pages: write
      id-token: write
    environment:
      name: github-pages
      url: ${{ steps.deployment.outputs.page_url }}
    steps:
    - id: deployment
      uses: actions/deploy-pages@v4
